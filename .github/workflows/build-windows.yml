name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package release (ZIP)
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          $zip = "alfapos_app-windows-x64.zip"
          if (-not (Test-Path "$src/alfapos_app.exe")) {
            Write-Error "alfapos_app.exe topilmadi: $src"
          }
          Compress-Archive -Path "$src/*" -DestinationPath $zip -Force
          Write-Host "Yaratildi: $zip ($(Get-Item $zip).Length bytes)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alfapos-windows-release
          path: alfapos_app-windows-x64.zip
          retention-days: 90

      - name: Publish GitHub Release (workflow_dispatch yoki tag)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $line = (Get-Content pubspec.yaml | Select-String '^version:').Line
          $ver = $line -replace 'version:\s*','' -replace '\+.*',''
          if ("${{ github.ref }}" -like 'refs/tags/v*') {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "windows-$ver-build${{ github.run_number }}"
          }
          gh release create $tag "alfapos_app-windows-x64.zip" `
            --title "AlfaPOS Windows $ver" `
            --notes "Windows x64 (Release). ZIP ichida alfapos_app.exe — papkani to'liq chiqarib, exe ni ishga tushiring." `
            --prerelease
