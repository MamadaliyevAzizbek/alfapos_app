name: alfapos_app
description: Alfapos - POS tizimi (Flutter).
publish_to: none
version: 1.0.7+14

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  mobile_scanner: ^7.2.0
  shared_preferences: ^2.2.2
  http: ^1.2.0
  http_parser: ^4.1.0
  flutter_cache_manager: ^3.4.1
  image_picker: ^1.2.0
  path_provider: ^2.1.2
  screenshot: ^3.0.0
  share_plus: ^12.0.1
  image: ^4.0.0
  gal: ^2.3.2
  printing: ^5.14.2
  pdf: ^3.11.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/alfapos_launcher.png
  # SVG qirralari kesilib qolmasligi uchun
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/branding/alfapos_logo.png
    - assets/branding/alfapos_sidebar_logo.png
